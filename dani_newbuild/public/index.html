<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DANI — Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111111;
      --border: #1e1e1e;
      --green: #00ff88;
      --green-dim: #00ff8833;
      --yellow: #ffe566;
      --red: #ff4466;
      --white: #f0ede6;
      --muted: #555;
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* header */
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 10vw, 6rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--white);
    }

    .logo span {
      color: var(--green);
    }

    .tagline {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    /* status pill */
    .status-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.55rem 1.1rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: border-color 0.3s;
    }

    .status-pill.online  { border-color: var(--green); }
    .status-pill.offline { border-color: var(--red); }
    .status-pill.checking { border-color: var(--yellow); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-pill.online  .dot { background: var(--green); animation: pulse 1.8s infinite; }
    .status-pill.offline .dot { background: var(--red); }
    .status-pill.checking .dot { background: var(--yellow); animation: blink 0.7s infinite; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 #00ff8866; }
      50% { box-shadow: 0 0 0 6px transparent; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* cards grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .card {
      background: var(--surface);
      padding: 1.4rem 1.6rem;
    }

    .card-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      word-break: break-all;
    }

    .card-value.green  { color: var(--green); }
    .card-value.yellow { color: var(--yellow); }
    .card-value.red    { color: var(--red); }

    /* ping countdown bar */
    .ping-section {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 1.4rem 1.6rem;
      margin-bottom: 2rem;
    }

    .ping-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }

    .bar-track {
      width: 100%;
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--green);
      width: 100%;
      transition: width 1s linear;
    }

    /* log feed */
    .log-section {
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .log-header {
      padding: 0.8rem 1.6rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s;
    }
    .log-clear:hover { border-color: var(--red); color: var(--red); }

    #log-feed {
      padding: 1rem 1.6rem;
      min-height: 160px;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .log-entry {
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      display: flex;
      gap: 0.8rem;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-ok   { color: var(--green); }
    .log-warn { color: var(--yellow); }
    .log-err  { color: var(--red); }

    /* footer */
    footer {
      margin-top: 3rem;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--white); }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">DAN<span>I</span></div>
      <div class="tagline">WhatsApp AI Bot — Render Deployment Monitor</div>
    </header>

    <div class="status-row">
      <div class="status-pill checking" id="status-pill">
        <div class="dot"></div>
        <span id="status-text">Checking…</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">Uptime</div>
        <div class="card-value green" id="uptime">—</div>
      </div>
      <div class="card">
        <div class="card-label">Last ping</div>
        <div class="card-value" id="last-ping">—</div>
      </div>
      <div class="card">
        <div class="card-label">Total pings</div>
        <div class="card-value" id="ping-count">—</div>
      </div>
      <div class="card">
        <div class="card-label">WhatsApp</div>
        <div class="card-value" id="wa-status">—</div>
      </div>
      <div class="card">
        <div class="card-label">Environment</div>
        <div class="card-value" id="env-val">—</div>
      </div>
      <div class="card">
        <div class="card-label">Memory used</div>
        <div class="card-value" id="mem-val">—</div>
      </div>
    </div>

    <div class="ping-section">
      <div class="ping-label">
        <span>Self-ping cycle (14 min)</span>
        <span id="next-ping-label">next ping in —</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="ping-bar"></div>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">
        <span>Activity log</span>
        <button class="log-clear" onclick="clearLog()">Clear</button>
      </div>
      <div id="log-feed"></div>
    </div>

    <footer>
      <span>Damini Codesphere © 2025</span>
      <a href="https://daniai.vercel.app" target="_blank">daniai.vercel.app ↗</a>
    </footer>
  </div>

  <script>
    const PING_INTERVAL_MS = 14 * 60 * 1000; // 14 minutes
    let lastPingTime = Date.now();

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${m}m ${sec}s`;
      if (m > 0) return `${m}m ${sec}s`;
      return `${sec}s`;
    }

    function fmtTime(d) {
      return d.toLocaleTimeString('en-ZA', { hour12: false });
    }

    function addLog(msg, type = 'ok') {
      const feed = document.getElementById('log-feed');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${fmtTime(new Date())}</span><span class="log-${type}">${msg}</span>`;
      feed.appendChild(entry);
      feed.scrollTop = feed.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log-feed').innerHTML = '';
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const d = await res.json();

        // pill
        const pill = document.getElementById('status-pill');
        const text = document.getElementById('status-text');
        pill.className = 'status-pill ' + (d.alive ? 'online' : 'offline');
        text.textContent = d.alive ? 'Online' : 'Offline';

        document.getElementById('uptime').textContent = fmt(d.uptime * 1000);
        document.getElementById('last-ping').textContent = d.lastPingAt
          ? fmtTime(new Date(d.lastPingAt)) : '—';
        document.getElementById('ping-count').textContent = d.pingCount ?? '—';

        const wa = document.getElementById('wa-status');
        wa.textContent = d.waConnected ? 'Connected ✓' : 'Disconnected';
        wa.className = 'card-value ' + (d.waConnected ? 'green' : 'red');

        document.getElementById('env-val').textContent = d.env ?? '—';

        const mb = (d.memUsed / 1024 / 1024).toFixed(1);
        document.getElementById('mem-val').textContent = mb + ' MB';

        lastPingTime = new Date(d.lastPingAt || Date.now()).getTime();
      } catch (e) {
        document.getElementById('status-pill').className = 'status-pill offline';
        document.getElementById('status-text').textContent = 'Unreachable';
        addLog('Status fetch failed: ' + e.message, 'err');
      }
    }

    // countdown bar
    function updateBar() {
      const elapsed = Date.now() - lastPingTime;
      const pct = Math.max(0, 100 - (elapsed / PING_INTERVAL_MS) * 100);
      document.getElementById('ping-bar').style.width = pct + '%';
      const remaining = Math.max(0, PING_INTERVAL_MS - elapsed);
      document.getElementById('next-ping-label').textContent = 'next ping in ' + fmt(remaining);
    }

    // init
    fetchStatus();
    addLog('Dashboard connected', 'ok');
    setInterval(fetchStatus, 30000);
    setInterval(updateBar, 1000);
    updateBar();
  </script>
</body>
</html>
